<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="../../src/css/styles.css?v=1" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
        crossorigin="anonymous"></script>
    <title>checkout</title>
  </head>
  <body class="body-custom">
    <div id="direccion-root"></div>
    
    <div id="payment-root"></div>

    <div id="resumen-root"></div>

    <script  src="/frontend/public/js/handlers/order/address.js"></script>
    <script type="module" src="/frontend/public/js/handlers/order/orders.js"></script>
    <script type="module" src="/frontend/public/js/handlers/order/checkout.js"></script>
    <script>
  function injectPartial(rootId, url) {
    fetch(url)
      .then(r => r.text())
      .then(html => {
        const root = document.getElementById(rootId);
        root.innerHTML = html;

        // Re-ejecutar <script> internos del parcial copiando atributos
        root.querySelectorAll('script').forEach(old => {
          const s = document.createElement('script');
          // copiar atributos importantes
          if (old.src) s.src = old.src;
          if (old.type) s.type = old.type;
          if (old.async) s.async = old.async;
          if (old.defer) s.defer = old.defer;
          // inline
          if (!old.src) s.textContent = old.textContent;
          document.body.appendChild(s);
          old.remove();
        });
      });
  }

  injectPartial('direccion-root','/frontend/public/partials/direccion.html');
  injectPartial('payment-root','/frontend/public/partials/payment.html');
  injectPartial('resumen-root','/frontend/public/partials/resumen.html');
</script>
  </body>
</html>
