<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="/frontend/src/css/styles.css" />

    <title>Document</title>
  </head>
  <body>
    <div class="container-fluid">
        <div class="row h-100 justify-content-center">
            <div class="col-12 col-md-8">
                <div class="card">
                    <div class="col-12"></div>
                    <div class="card-header">
                        <h5>Dirección de entrega</h5>
                    </div>
                    <div class="card-body">
                        <form class="form" >
                            <label for="nombre" class="form-label">Nombre</label>
                            <input id="nombre" type="text" class="form-control">
                            
                            <label for="telefono" class="form-label">Telefono</label>
                            <input id="telefono" type="number"  class="form-control">
                            
                            <label for="calle" class="form-label">Calle</label>
                            <input id="calle" type="text"  class="form-control">
                            
                            <label for="numero" class="form-label">Número</label>
                            <input id="numero" type="number"  class="form-control">
                            
                            <label for="depto" class="form-label">Depto (opcional)</label>
                            <input id="depto" type="text"  class="form-control">
                            
                            <label for="comuna" class="form-label">Comuna</label>
                            <input id="comuna" type="text"  class="form-control">
                            
                            <label for="ciudad" class="form-label">Ciudad</label>
                            <input id="ciudad" type="text"  class="form-control">
                            <button class="btn btn-primary" type="submit">
                                Guardar Direccion
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
  </body>
</html>
