<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="/frontend/src/css/styles.css" />

    <title>Document</title>
  </head>
  <body>
    <button
      type="button"
      class="btn btn-primary"
      data-bs-toggle="modal"
      data-bs-target="#exampleModal"
    >
      *producto*
    </button>
    <div
      class="modal fade"
      id="exampleModal"
      tabindex="-1"
      data-bs-backdrop="static"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header align-items-center">
                <h5>Producto</h5>
            </div>
          <div class="modal-body">
  <div class="container-fluid">
    <div class="row g-4 align-items-stretch">
   
      <div class="col-md-5">
        <img
          src="https://picsum.photos/500/500"
          alt="Descripción"
          class="img-fluid w-100 h-100 object-fit-cover rounded d-block"
        />
      </div>

      <!-- Columna texto + controles -->
      <div class="col-md-7">
        <h6>Descripción</h6>
        <p class="mb-3">
          Lorem ipsum dolor sit amet consectetur adipisicing elit. Incidunt tempore
          reprehenderit quisquam fugiat itaque distinctio exercitationem at fugit maxime
          sapiente nesciunt, magnam facere optio debitis id, atque aut dignissimos cum.
        </p>

   
        <div class="controls-wrap mx-auto mx-md-0" style="max-width: 420px;">
          <p class="fw-semibold fst-italic mb-2">$9.990</p>

       
          <div class="row g-2 align-items-center justify-content-center justify-content-md-start">
            <div class="col-12 col-sm-6 col-md-5">
              <input type="number" class="form-control text-center" min="1" value="1" />
            </div>
            <div class="col-auto d-grid">
              <button class="btn  px-4">Agregar al carrito</button>
            </div>
          </div>

       
          <div class="row g-2 mt-2">
            <div class="col-12 d-grid">
              <button class="btn " data-bs-dismiss="modal">Volver al catálogo</button>
            </div>
          </div>
        </div>
       
      </div>
     
    </div>
  </div>
</div>

      </div>
    </div>
  </body>
</html>
