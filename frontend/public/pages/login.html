<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="/frontend/src/css/styles.css" />

    <title>Registrate</title>
  </head>
  <body>
        <div class="container min-vh-100 d-flex justify-content-center align-items-center">
            <div class="row w-100">
                <div class="col-12 col-md-6 mx-auto">
                <div class="card">
                    <div class="card-header">
                        <h5>Iniciar Sesión</h5>
                    </div>
                    <div class="card-body">
                        <form id="registerForm" novalidate class="form">
                            
                             
                            <label for="email-form" class="form-label">
                                <h6>Email</h6>
                            </label>
                            <input 
                            type="email" 
                            class="form-control" 
                            id="email-form"
                     
                            required
                            >
                            <div id="emailHelper" class="invalid-feedback">
                                Este campo es obligatorio.
                            </div>
                            
                            <label for="pwd" class="form-label">
                                <h6>Contraseña</h6>
                            </label>
                            <input 
                            type="password"
                            id="pwd"
                            class="form-control"
                            maxlength="15"
                            
                            required>
                            
                            <button type="submit" class="btn btn-primary">
                                Iniciar Sesión
                            </button>
                            <hr>
                        </form>
                        <p class="form-label">¿Nuevo Usuario?</p>
                        <a href="register.html" class="btn btn-primary">
                            Registrate
                        </a>
                        
                    </div>
                </div>
                </div>
            </div>
        </div>
        <script>
            
        </script>
  </body>
</html>
