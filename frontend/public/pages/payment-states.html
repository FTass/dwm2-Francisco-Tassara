<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="/frontend/src/css/styles.css" />

    <title>Estado de tu pedido</title>
  </head>
  <body>
    <div class="container">
    
        <div class="row min-vh-100 align-items-center">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h6 class="card-title">Tu pedido</h6>
                    </div>
                    <div class="card-body">
                        <ul class="list-group">
                            <li class="list-group-item"><span class="fw-bold">Método: </span>WebPay</li>
                            <li class="list-group-item"><span class="fw-bold">Resultado: </span>Exito</li>
                            <li class="list-group-item text-center"><span class="fw-bold">Estado del pedido: </span>Pagado</li>
                        </ul>
                        <div class="col-12 text-center">
                            <button class="btn btn-primary mt-3 w-50">
                                Volver al Inicio
                            </button>
                        </div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header">
                        <h6 class="card-title">Tu pedido</h6>
                    </div>
                    <div class="card-body">
                        <ul class="list-group">
                            <li class="list-group-item"><span class="fw-bold">Método: </span>Transferencia</li>
                            <li class="list-group-item"><span class="fw-bold">Resultado: </span>Fallo</li>
                            <li class="list-group-item text-center"><span class="fw-bold">Estado del pedido: </span>Rechazado, intente nuevamente con otro método</li>

                        </ul>
                        <div class="row">
                            <div class="col-12 col-md-6 text-center">
                                <button class="btn btn-primary mt-3 w-100">
                                    Reintentar pago
                                </button>
                            </div>
                            <div class="col-12 col-md-6 text-center">
                                <button class="btn btn-primary mt-3  w-100">
                                    Cambiar método de pago
                                </button>
                            </div>

                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
  </body>
</html>
