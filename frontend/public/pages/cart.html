<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Carrito | Queso & Sabor</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <link rel="stylesheet" href="/frontend/src/css/styles.css" />
  </head>
  <body class="body-custom">
    <!-- Header parcial -->
    <header id="header-partial"></header>

    <main class="container py-5">
      <h1 class="mb-4">Tu carrito</h1>

      <!-- Tabla del carrito -->
      <div class="row g-4">
        <div class="col-12 col-lg-8">
          <div class="table-responsive">
            <table class="table align-middle">
              <thead class="table-light">
                <tr>
                  <th>Producto</th>
                  <th class="text-center">Precio</th>
                  <th class="text-center">Cantidad</th>
                  <th class="text-end">Subtotal</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>
                    <div class="d-flex align-items-center gap-3">
                      <img
                        src="https://picsum.photos/seed/cheese1/80/80"
                        class="rounded"
                        style="width: 64px; height: 64px; object-fit: cover"
                        alt="Queso"
                      />
                      <div>
                        <div class="fw-semibold">Queso Brie</div>
                        <small class="text-muted">SKU: Q001</small>
                      </div>
                    </div>
                  </td>
                  <td class="text-center">$4.500</td>
                  <td class="text-center">3</td>
                  <td class="text-end fw-semibold">$9.000</td>
                </tr>
                <tr>
                  <td>
                    <div class="d-flex align-items-center gap-3">
                      <img
                        src="https://picsum.photos/seed/cheese2/80/80"
                        class="rounded"
                        style="width: 64px; height: 64px; object-fit: cover"
                        alt="Queso"
                      />
                      <div>
                        <div class="fw-semibold">Queso Gauda</div>
                        <small class="text-muted">SKU: Q002</small>
                      </div>
                    </div>
                  </td>
                  <td class="text-center">$5.000</td>
                  <td class="text-center">1</td>
                  <td class="text-end fw-semibold">$5.000</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Resumen -->
        <div class="col-12 col-lg-4">
          <div class="card login shadow-sm">
            <div class="card-body">
              <h5 class="card-title mb-3">Resumen</h5>
              <div class="d-flex justify-content-between mb-2">
                <span>Subtotal</span>
                <strong>$14.000</strong>
              </div>
              <div class="d-flex justify-content-between mb-2">
                <span>Envío</span>
                <span>$0</span>
              </div>
              <hr />
              <div class="d-flex justify-content-between fs-5 mb-3">
                <span>Total</span>
                <strong>$14.000</strong>
              </div>
              <div class="d-grid gap-2">
                <a href="/frontend/public/index.html#quesos" class="btn btn-outline-secondary">
                  Seguir comprando
                </a>
                <a
                  href="/frontend/public/pages/checkout.html"
                  class="btn  btn-primary"
                >
                  Continuar al checkout
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer id="footer-partial" class="mt-5"></footer>
  </body>
</html>
