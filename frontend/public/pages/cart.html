<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Carrito | Queso & Sabor</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="/frontend/src/css/styles.css" />
  </head>
  <body class="body-custom">
    <!-- Header parcial -->
    <header id="header-partial"></header>

    <main class="container py-5">
      <h1 class="mb-4">Tu carrito</h1>

      <!-- Tabla del carrito -->
      <div class="row g-4">
        <div class="col-12 col-lg-8">
          <div class="table-responsive">
            <table class="table align-middle">
              <thead class="table-light">
                <tr>
                  <th>Producto</th>
                  <th class="text-center">Precio</th>
                  <th class="text-center">Cantidad</th>
                  <th class="text-end">Subtotal</th>
                </tr>
              </thead>
              <tbody id="cartTableBody"></tbody>
            </table>
          </div>
        </div>

        <!-- Resumen -->
        <div class="col-12 col-lg-4">
          <div class="card login shadow-sm">
            <div class="card-body">
              <h5 class="card-title mb-3">Resumen</h5>
              <div class="d-flex justify-content-between mb-2">
                <span>Subtotal</span>
                <strong id="cartSubTotal">$0</strong>
              </div>
              <div class="d-flex justify-content-between mb-2">
                <span>Envío</span>
                <span>$0</span>
              </div>
              <hr />
              <div class="d-flex justify-content-between fs-5 mb-3">
                <span>Total</span>
                <strong id="cartTotal">$0</strong>
              </div>
              <div class="d-grid gap-2">
                <a href="/frontend/public/index.html#quesos" class="btn btn-outline-secondary">
                  Seguir comprando
                </a>
                <a
                  href="/frontend/public/pages/checkout.html"
                  class="btn  btn-primary"
                >
                  Continuar al checkout
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer id="footer-partial" class="mt-5"></footer>
    <script src="/frontend/public/js/handlers/cart/cart-page.js"></script>
    <script src="/frontend/public/js/handlers/cart/cart.js"></script>
  </body>
</html>
