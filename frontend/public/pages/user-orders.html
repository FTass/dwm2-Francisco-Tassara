<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="/frontend/src/css/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>
    <title>Order Management</title>
  </head>
  <body class="body-custom">
    <div id="navbar-root"></div>

    <div class="container my-5">
      <h1 class="mb-4">My Orders</h1>
      <div class="row">
        
      <div class="table-responsive">

        <table class="table table-responsive table-bordered">
          <thead class="table-warning">
            <tr>
                  <th>Numero</th>
                  <th>Fecha</th>
                  <th>Status</th>
                  <th>Total</th>            
                  <th>Enviado En</th>
                  <th>Entregado En</th>
                  <th>Acciones</th>
                  
            </tr>
          </thead>
          <tbody id="order-table-body">
            
          </tbody>
        </table>
      </div>
    </div>
    <nav id="pagination">
  <ul class="pagination justify-content-center">
    <li class="page-item" id="prev-page">
      <a class="page-link" href="#" id="prev">
        <span aria-hidden="true">&laquo;</span>
      </a>
    </li>

    <li class="page-item disabled">
      <span class="page-link" id="page-info">1 / 1</span>
    </li>

    <li class="page-item" id="next-page">
      <a class="page-link" href="#" id="next">
        <span aria-hidden="true">&raquo;</span>
      </a>
    </li>
  </ul>
</nav>

    <script type="module" src="/frontend/public/js/imports/navbar_carrito-import.js"></script>
    
     
    <div
      class="modal fade"
      id="editOrderModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Editar Orden</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form class="form" id="orderForm">
             

              <label for="status" class="form-label">Status</label>
              <select id="status" type="number" class="form-control" required>
                <option value="" selected>Selecciona una opción</option>
                <option value='pending_payment'>pendiente</option>
                <option value='paid'>pagado</option>
                <option value='shipped'>Enviado</option>
                <option value='delivered'>Entregado</option>
                <option value='cancelled'>Cancelado</option>
              </select>

              <label for="address" class="form-label">
                Dirección</label
              >
              <select id="address" class="form-control" required>
                <option value="" selected>Selecciona una dirección</option>
                
              </select>

              <div class="row d-flex justify-content-center m-2">
                <button
                  class="btn btn-login-form"
                  type="submit"
                  id="editOrderSubmit"
                >
                  Guardar Cambios
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

        </div>
      </div>
    </div>
    <script type="module" src="/frontend/public/js/handlers/order/userOrders.js"></script>
    
  </body>
  
</html>
