<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="/frontend/src/css/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>
    <title>Stock Management</title>
  </head>
  <body class="body-custom">
    <div id="navbar-root"></div>

    <div class="container my-5">
      <h1 class="mb-4">Stock Management</h1>
      <div class="row">
        <div class="col-md-4">
          <div class="mb-3">
            <label for="categorySelect" class="form-label"
              >Buscar producto categoria</label
            >
            <select class="form-select" id="categorySelect">
              <option value="none">Categorias</option>
            </select>
          </div>
        </div>
        <div class="col-md-4">
          <div class="mb-3">
            <label for="milkFilter" class="form-label"
              >Buscar por tipo de leche</label
            >
            <select class="form-select" id="milkFilter">
              <option value="none">Leches</option>
            </select>
          </div>
        </div>
        <div class="col-md-4">
            <div class="mb-3">
                <label  class="form-label" for="lowStockFilter">Stock Bajo</label>
                <select class="form-select" id="lowStockFilter">
                    <option value="none">Selecciona una opción</option>
                    <option value="true">Sí</option>
                    <option value="false">No</option>
                </select>
                
            </div>
        </div>
      </div>
      <div class="mb-4">
        <label for="productSelect" class="form-label"
          >Selecciona un producto:</label
        >
        <select class="form-select" id="productSelect" disabled>
          <option value="">-- Elige un producto --</option>
        </select>
      </div>

      <table class="table table-bordered">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Cantidad</th>
            <th>admin</th>
          </tr>
        </thead>
        <tbody id="stock-table-body">
          <tr>
            <td colspan="4" class="text-center text-muted">
              Selecciona un producto
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <script src="/frontend/public/js/imports/navbar_carrito-import.js"></script>
    <script
      type="module"
      src="/frontend/public/js/handlers/admin/stockMovement.js"
    ></script>
    <div
      class="modal fade"
      id="editProductModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Editar producto</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form class="form" id="productForm">
              <label for="quantity" class="form-label">Cantidad</label>
              <input id="quantity" type="number" class="form-control" min="1" required/>

              <label for="isOffer" class="form-label">¿Oferta?</label>
              <select id="isOffer" type="number" class="form-control" required>
                <option value="" selected>Selecciona una opción</option>
                <option value="true">Oferta</option>
                <option value="false">No oferta</option>
              </select>

              <label for="discountPercentage" class="form-label">
                % Descuento</label
              >
              <input
                id="discountPercentage"
                type="number"
                class="form-control"
                min="1"
                max="99"
                disabled
              />

              <label for="reason" class="form-label">Motivo</label>
              <textarea id="reason" class="form-control" required></textarea>

              <div class="form-check mt-3"></div>
              <div class="row d-flex justify-content-center m-2">
                <button
                  class="btn btn-login-form"
                  type="submit"
                  id="editProductSubmit"
                >
                  Guardar Cambios
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
