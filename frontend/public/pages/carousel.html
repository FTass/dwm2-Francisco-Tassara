<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="/frontend/src/css/styles.css" />
    <title>Document</title>
</head>
<body>
    <div class="container my-3">
        <div id="skeleton" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#skeleton" data-bs-slide-to="0" class="active"
                    aria-current="true"></button>
                <button type="button" data-bs-target="#skeleton" data-bs-slide-to="1"></button>
                <button type="button" data-bs-target="#skeleton" data-bs-slide-to="2"></button>
            </div>

            <div class="carousel-inner ratio ratio-21x9">
                <div class="carousel-item active">
                    <img src="https://picsum.photos/1200/400?1" class="d-block w-150" alt="slide 1">
                </div>
                <div class="carousel-item">
                    <img src="https://picsum.photos/1200/400?2" class="d-block w-150" alt="slide 2">
                </div>
                <div class="carousel-item">
                    <img src="https://picsum.photos/1200/400?3" class="d-block w-150" alt="slide 3">
                </div>
            </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#skeleton" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#skeleton" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
            </button>
        </div>
    </div>
</body>
</html>
