<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="/frontend/src/css/styles.css" />

    <title>Document</title>
  </head>
  <body>
    <!-- Botón para abrir el carrito -->
    <button class="btn btn-outline-secondary" data-bs-toggle="offcanvas" data-bs-target="#cartDrawer" aria-controls="cartDrawer">
    <i class="bi bi-cart3"></i> <span id="cart-count" class="badge bg-danger ms-1">0</span>
    </button>


    <div class="offcanvas offcanvas-end" tabindex="-1" id="cartDrawer" aria-labelledby="cartDrawerLabel">
    <div class="offcanvas-header">
        <h5 id="cartDrawerLabel" class="mb-0">Tu carrito</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
    </div>

    <div class="offcanvas-body d-flex flex-column">
        
        <ul id="cart-items" class="list-group list-group-flush mb-3">
            <li>Queso Gouda</li>
        </ul>

        <!-- Resumen -->
        <div class="mt-auto">
        <div class="d-flex justify-content-between">
            <span>Subtotal</span><strong id="cart-subtotal">$0</strong>
        </div>
        <div class="d-grid gap-2 mt-3">
            <a href="/cart.html" class="btn btn-outline-primary">Ver carrito</a>
            <button id="checkout-btn" class="btn btn-primary">Ir a pagar</button>
        </div>
        </div>
    </div>
    </div>

  </body>
</html>
