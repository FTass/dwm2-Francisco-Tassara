    <div
      class="modal fade"
      id="editOrderModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Editar Orden</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form class="form" id="orderForm">
             

              <label for="status" class="form-label">Status</label>
              <select id="status" type="number" class="form-control" required>
                <option value="" selected>Selecciona una opción</option>
                <option value='pending_payment'>pendiente</option>
                <option value='paid'>pagado</option>
                <option value='shipped'>Enviado</option>
                <option value='delivered'>Entregado</option>
                <option value='cancelled'>Cancelado</option>
              </select>

              <label for="address" class="form-label">
                Dirección</label
              >
              <select id="address" class="form-control" required>
                <option value="" selected>Selecciona una dirección</option>
                
              </select>

              <div class="row d-flex justify-content-center m-2">
                <button
                  class="btn btn-login-form"
                  type="submit"
                  id="editOrderSubmit"
                >
                  Guardar Cambios
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Formulario para agregar nueva dirección (oculto) -->
    <div
      class="modal fade"
      id="newAddressModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Agregar Nueva Dirección</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form class="form" id="addressForm">
              <label for="calle" class="form-label">Calle</label>
              <input id="calle" type="text" class="form-control" />

              <label for="numero" class="form-label">Número</label>
              <input id="numero" type="number" class="form-control" />

              <label for="depto" class="form-label">Depto (opcional)</label>
              <input id="depto" type="text" class="form-control" />

              <label for="comuna" class="form-label">Comuna</label>
              <input id="comuna" type="text" class="form-control" />

              <label for="ciudad" class="form-label">Ciudad</label>
              <input id="ciudad" type="text" class="form-control" />
              
              <div class="form-check mt-3">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="useProfileAddressBtn"
                  value="true"
                />
                <label class="form-check-label" for="useProfileAddressBtn">
                  Marcar como predeterminada
                </label>
              </div>
              
              <div class="row d-flex justify-content-center m-2">
                <button class="btn btn-login-form" type="submit" id="addressSubmit">
                  Guardar Dirección
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
        </div>
      </div>
