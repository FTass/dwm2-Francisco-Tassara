<div class="container-fluid mb-4">
  <div class="row h-100 justify-content-center">
    <div class="col-12 col-md-8">
      <div class="card login">
        <div class="col-12"></div>
        <div class="card-header">
          <h5>Dirección de entrega</h5>
        </div>
        <div class="card-body">
          <div class="row">
            <div class="col-12">
              <select class="form-select" id="addressSelect"></select>
            </div>
          </div>
          <div class="row my-2 d-flex justify-content-center">

          
            <div class="col-6 d-flex justify-content-center">
              <button class="btn btn-primary" 
              id="addNewAddressBtn"
              data-bs-toggle="modal"
              data-bs-target="#editAddressModal">
                Agregar nueva dirección
              </button>
              
            </div>
            <div class="col-6 d-flex justify-content-center">
              <button class="btn btn-danger" id="deleteAddressBtn">
                <i class="fas fa-trash"></i> Eliminar
              </button>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
  
</div>

<div class="modal fade" id="editAddressModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Editar Dirección</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
        ></button>
      </div>
      <div class="modal-body">
        <form class="form" id="addressForm">
          <!-- <label for="nombre" class="form-label">Nombre</label>
                            <input id="nombre" type="text" class="form-control"> -->

          <label for="calle" class="form-label">Calle</label>
          <input id="calle" type="text" class="form-control" />

          <label for="numero" class="form-label">Número</label>
          <input id="numero" type="number" class="form-control" />

          <label for="depto" class="form-label">Depto (opcional)</label>
          <input id="depto" type="text" class="form-control" />

          <label for="comuna" class="form-label">Comuna</label>
          <input id="comuna" type="text" class="form-control" />

          <label for="ciudad" class="form-label">Ciudad</label>
          <input id="ciudad" type="text" class="form-control" />
          <div class="form-check mt-3">
            <input
              class="form-check-input"
              type="checkbox"
              id="useProfileAddressBtn"
              value="true"
            />
            <label class="form-check-label" for="useProfileAddressBtn">
              Marcar como predeterminada
            </label>
          </div>
          <div class="row d-flex justify-content-center m-2">
            <button class="btn btn-login-form" type="submit" id="addressSubmit">
              Guardar Direccion
            </button>
          </div>
        </form>
      </div>
      
    </div>
  </div>
</div>
