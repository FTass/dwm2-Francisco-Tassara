<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="/frontend/src/css/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <title>Queso & Sabor</title>
  </head>

  <body class="body-custom">
    <!-- navbar importado -->
    <div id="navbar-root"></div>

    <!--Carpousel importado-->
    <div id="carousel-root"></div>
    <!--Destacados importado-->
    <div id="destacados-root"></div>

    <!--Catalogo importado-->
    <section>
      <div id="catalogo-root"></div>
    </section>
    <!--Categorias importado-->
    <section>
      <div id="categorias-root"></div>
    </section>

    <section>
      <div id="footer-root"></div>
    </section>
    <script>
      fetch("/frontend/public/partials/vista-detallada.html")
  .then(r => r.text())
  .then(html => {
    document.body.insertAdjacentHTML("beforeend", html);

    const modalEl = document.getElementById("exampleModal");
    if (!modalEl) {
      console.error("No se encontró #exampleModal");
      return;
    }

    // 2️⃣ Detectar apertura del modal (evento de Bootstrap)
    modalEl.addEventListener("show.bs.modal", (event) => {
      const trigger = event.relatedTarget; // la card o botón que lo abrió
      if (!trigger) return;

      // Leer datos desde atributos data-*
      const name  = trigger.getAttribute("data-product-name")  || "Producto";
      const price = trigger.getAttribute("data-product-price") || "";
      const img   = trigger.getAttribute("data-product-img")   || "https://picsum.photos/500/500";
      const desc  = trigger.getAttribute("data-product-desc")  || "";

      // Actualizar contenido del modal
      const $ = (id) => document.getElementById(id);
      $("exampleModalLabel").textContent = name;
      $("modalProductImg").src = img;
      $("modalProductImg").alt = name;
      $("modalProductPrice").textContent = price;
      $("modalProductDesc").textContent = desc;

      const qty = $("modalQty");
      if (qty) qty.value = 1;

      const addBtn = $("addToCartBtn");
      if (addBtn) {
        addBtn.onclick = () => {
          console.log("Agregar al carrito:", {
            name,
            price,
            img,
            qty: Number(qty?.value || 1),
          });
        };
      }
    });

    // 3️⃣ Asegura que las cards tengan los atributos necesarios
    document.querySelectorAll(".card.prod").forEach(card => {
      card.setAttribute("data-bs-toggle", "modal");
      card.setAttribute("data-bs-target", "#exampleModal");

      // fallback: si aún no tienen los data-*, se los agrega
      const h5 = card.querySelector("h5")?.textContent.trim() || "Producto";
      const em = card.querySelector("em")?.textContent.trim() || "";
      const img = card.querySelector("img")?.src || "https://picsum.photos/500/500";

      card.setAttribute("data-product-name", h5);
      card.setAttribute("data-product-price", em);
      card.setAttribute("data-product-img", img);
      card.setAttribute("data-product-desc", "");
    });
  })
  .catch(console.error);
  
      fetch("/frontend/public/partials/navbar.html")
        .then((r) => r.text())
        .then((html) => {
          document.getElementById("navbar-root").innerHTML = html;
        })
        .then(() => {
          return Promise.all([
            fetch("/frontend/public/partials/carrito-btn.html")
              .then((r) => r.text())
              .then((html) => {
                const btnSlot = document.getElementById("cart-btn");
                if (btnSlot) btnSlot.innerHTML = html;
              }),
            fetch("/frontend/public/partials/carrito-content.html")
              .then((r) => r.text())
              .then((html) => {
                let contentSlot = document.getElementById("cart-content");
                if (!contentSlot) {
                  contentSlot = document.createElement("div");
                  contentSlot.id = "cart-content";
                  document.body.appendChild(contentSlot);
                }
                contentSlot.innerHTML = html;
              }),
          ]);
        });
      Promise.all([
        fetch("/frontend/public/partials/carousel.html")
          .then((r) => r.text())
          .then((html) => {
            document.getElementById("carousel-root").innerHTML = html;
          }),
        fetch("/frontend/public/partials/destacados.html")
          .then((r) => r.text())
          .then((html) => {
            document.getElementById("destacados-root").innerHTML = html;
          }),
        fetch("/frontend/public/partials/catalogo.html")
          .then((r) => r.text())
          .then((html) => {
            document.getElementById("catalogo-root").innerHTML = html;
          }),
        fetch("/frontend/public/partials/categorias.html")
          .then((r) => r.text())
          .then((html) => {
            document.getElementById("categorias-root").innerHTML = html;
          }),
        fetch("/frontend/public/partials/footer.html")
          .then((r) => r.text())
          .then((html) => {
            document.getElementById("footer-root").innerHTML = html;
          }),
      ]).catch(console.error);
    </script>
  </body>
</html>
