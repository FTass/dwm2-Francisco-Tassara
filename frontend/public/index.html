<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="/frontend/src/css/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <title>Queso & Sabor</title>
  </head>

  <body class="body-custom">
    <!-- navbar importado -->
    <div id="navbar-root"></div>

    <!--Carpousel importado-->
    <div id="carousel-root"></div>
    <!--Destacados importado-->
    <div id="destacados-root"></div>

    <!--Catalogo importado-->
    <section>
      <div id="catalogo-root"></div>
    </section>
    <!--Categorias importado-->
    <section>
      <div id="categorias-root"></div>
    </section>

    <section>
      <div id="footer-root"></div>
    </section>
    <script>
      // 1) Inyecta el modal
  const modalReady = fetch(".../public/partials/product-modal.html")
    .then(r => r.text())
    .then(html => {
      document.body.insertAdjacentHTML("beforeend", html);
      return document.getElementById("exampleModal");
    });

  // 2) Cuando el modal esté listo, engancha el click delegado
  modalReady.then((modalEl) => {
    if (!modalEl) { console.error("No se encontró #exampleModal"); return; }

    // Delegación sobre TODO el body (sirve para contenido cargado por fetch)
    document.body.addEventListener("click", (e) => {
      const card = e.target.closest(".card.prod");
      if (!card) return; // no es una card

      // Datos desde la card
      const name  = card.querySelector("h5")?.textContent.trim() || "Producto";
      const price = card.querySelector("em")?.textContent.trim() || "";
      const img   = card.querySelector("img")?.src || "https://picsum.photos/500/500";
      const desc  = "";

      // Pinta en el modal (IDs deben existir)
      const $ = (id) => document.getElementById(id);
      const lbl = $("exampleModalLabel");
      const pic = $("modalProductImg");
      const prc = $("modalProductPrice");
      const dsc = $("modalProductDesc");
      const qty = $("modalQty");
      const add = $("addToCartBtn");

      if (lbl) lbl.textContent = name;
      if (pic) { pic.src = img; pic.alt = name; }
      if (prc) prc.textContent = price;
      if (dsc) dsc.textContent = desc;
      if (qty) qty.value = 1;
      if (add) add.onclick = () =>
        console.log("Agregar al carrito:", { name, price, img, qty: Number(qty?.value || 1) });

      // Abre el modal (Bootstrap 5)
      if (!window.bootstrap) { console.error("Bootstrap no cargó"); return; }
      bootstrap.Modal.getOrCreateInstance(modalEl).show();
    });
  }).catch(console.error);
      fetch("/frontend/public/partials/navbar.html")
        .then((r) => r.text())
        .then((html) => {
          document.getElementById("navbar-root").innerHTML = html;
        })
        .then(() => {
          return Promise.all([
            fetch("/frontend/public/partials/carrito-btn.html")
              .then((r) => r.text())
              .then((html) => {
                const btnSlot = document.getElementById("cart-btn");
                if (btnSlot) btnSlot.innerHTML = html;
              }),
            fetch("/frontend/public/partials/carrito-content.html")
              .then((r) => r.text())
              .then((html) => {
                let contentSlot = document.getElementById("cart-content");
                if (!contentSlot) {
                  contentSlot = document.createElement("div");
                  contentSlot.id = "cart-content";
                  document.body.appendChild(contentSlot);
                }
                contentSlot.innerHTML = html;
              }),
          ]);
        });
      Promise.all([
        fetch("/frontend/public/partials/carousel.html")
          .then((r) => r.text())
          .then((html) => {
            document.getElementById("carousel-root").innerHTML = html;
          }),
        fetch("/frontend/public/partials/destacados.html")
          .then((r) => r.text())
          .then((html) => {
            document.getElementById("destacados-root").innerHTML = html;
          }),
        fetch("/frontend/public/partials/catalogo.html")
          .then((r) => r.text())
          .then((html) => {
            document.getElementById("catalogo-root").innerHTML = html;
          }),
        fetch("/frontend/public/partials/categorias.html")
          .then((r) => r.text())
          .then((html) => {
            document.getElementById("categorias-root").innerHTML = html;
          }),
        fetch("/frontend/public/partials/footer.html")
          .then((r) => r.text())
          .then((html) => {
            document.getElementById("footer-root").innerHTML = html;
          }),
      ]).catch(console.error);
    </script>
  </body>
</html>
