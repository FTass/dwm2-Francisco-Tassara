<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="/frontend/src/css/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>
    <title>Queso & Sabor</title>
  </head>

  <body class="body-custom">
    <!-- navbar importado -->
    <div id="navbar-root"></div>

    <!--Carrousel importado-->
    <div id="carousel-root"></div>

    <!--Destacados importado-->
    <div id="destacados-root"></div>

    <!--Catálogo importado-->
    <section>
      <div id="catalogo-root"></div>
    </section>

    <!--Categorías importado-->
    <section>
      <div id="categorias-root"></div>
    </section>

    <!--Footer importado-->
    <section>
      <div id="footer-root"></div>
    </section>
    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 11000">
      <div id="logoutToast" class="toast border-0" role="alert">
        <div class="d-flex align-items-center text-bg-warning p-3 rounded">
          <div class="toast-body flex-grow-1" id="toastMsg"></div>
          <div class="spinner-grow spinner-border-sm text-secondary ms-3" role="status" style="display: none;">
            <span class="visually-hidden">Loading...</span>
          </div>
          <button type="button" class="btn-close btn-close-white ms-3" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
      </div>
    </div>
    <!-- Fetchs -->
    <script type="module" src="/frontend/public/js/handlers/cart/render-cart-quantity.js"></script>
    <script src="/frontend/public/js/handlers/cart/cart.js"></script>
    <script src="/frontend/public/js/handlers/catalogo/product.js"></script>


    <script src="/frontend/public/js/imports/navbar_carrito-import.js"></script>
    <script src="/frontend/public/js/imports/catalogo-import.js"></script>
    <script src="/frontend/public/js/imports/destacados-import.js"></script>
    <script src="/frontend/public/js/imports/modal-import.js"></script>
    <script src="/frontend/public/js/imports/carousel-import.js"></script>
    <script src="/frontend/public/js/imports/categorias-import.js"></script>
    <script src="/frontend/public/js/imports/footer-import.js"></script>
  <script  src="/frontend/public/js/imports/detailed.js"></script>
    <!-- Handlers -->
    <script src="/frontend/public/js/handlers/catalogo/offers.js"></script>
    <script src="/frontend/public/js/handlers/catalogo/highlight.js"></script>
    <script src="/frontend/public/js/handlers/catalogo/combos.js"></script>
    <script src="/frontend/public/js/handlers/catalogo/tables.js"></script>
    <script type="module" src="/frontend/public/js/handlers/cart/render-cart.js"></script>

    <script>
      Promise.all([
        carouselPromise,
        destacadosPromise,
        catalogoPromise,
        categoriasPromise,
        footerPromise,
      ]).catch(console.error);
    </script>
  </body>
</html>
