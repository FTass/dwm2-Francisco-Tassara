<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="/frontend/src/css/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>
    <title>Queso & Sabor</title>
  </head>

  <body class="body-custom">
    <!-- navbar importado -->
    <div id="navbar-root"></div>

    <!--Carrousel importado-->
    <div id="carousel-root"></div>

    <!--Destacados importado-->
    <div id="destacados-root"></div>

    <!--Catálogo importado-->
    <section>
      <div id="catalogo-root"></div>
    </section>

    <!--Categorías importado-->
    <section>
      <div id="categorias-root"></div>
    </section>

    <!--Footer importado-->
    <section>
      <div id="footer-root"></div>
    </section>

    <!-- Handlers -->
    <script src="/frontend/public/js/handlers/product.js"></script>
    <script src="/frontend/public/js/handlers/offers.js"></script>
    <script src="/frontend/public/js/handlers/highlight.js"></script>

    <script>
      // ==========================
      // MODAL DE VISTA DETALLADA
      // ==========================
      fetch("/frontend/public/partials/vista-detallada.html")
        .then((r) => r.text())
        .then((html) => {
          document.body.insertAdjacentHTML("beforeend", html);

          const modalEl = document.getElementById("exampleModal");
          if (!modalEl) {
            console.error("No se encontró #exampleModal");
            return;
          }

          modalEl.addEventListener("show.bs.modal", (event) => {
            const trigger = event.relatedTarget;
            if (!trigger) return;

            const name =
              trigger.getAttribute("data-product-name") || "Producto";
            const price = trigger.getAttribute("data-product-price") || "";
            const img =
              trigger.getAttribute("data-product-img") ||
              "https://picsum.photos/500/500";
            const desc = trigger.getAttribute("data-product-desc") || "";

            const $ = (id) => document.getElementById(id);
            $("exampleModalLabel").textContent = name;
            $("modalProductImg").src = img;
            $("modalProductImg").alt = name;
            $("modalProductPrice").textContent = price;
            $("modalProductDesc").textContent = desc;

            const qty = $("modalQty");
            if (qty) qty.value = 1;

            const addBtn = $("addToCartBtn");
            if (addBtn) {
              addBtn.onclick = () => {
                console.log("Agregar al carrito:", {
                  name,
                  price,
                  img,
                  qty: Number(qty?.value || 1),
                });
              };
            }
          });

          // fallback por si hay cards ya renderizadas en el HTML estático
          document.querySelectorAll(".card.prod").forEach((card) => {
            card.setAttribute("data-bs-toggle", "modal");
            card.setAttribute("data-bs-target", "#exampleModal");

            const h5 =
              card.querySelector("h5")?.textContent.trim() || "Producto";
            const em = card.querySelector("em")?.textContent.trim() || "";
            const img =
              card.querySelector("img")?.src || "https://picsum.photos/500/500";

            card.setAttribute("data-product-name", h5);
            card.setAttribute("data-product-price", em);
            card.setAttribute("data-product-img", img);
            card.setAttribute("data-product-desc", "");
          });
        })
        .catch(console.error);

      // ==========================
      // NAVBAR + CARRITO
      // ==========================
      fetch("/frontend/public/partials/navbar.html")
        .then((r) => r.text())
        .then((html) => {
          document.getElementById("navbar-root").innerHTML = html;
        })
        .then(() => {
          return Promise.all([
            fetch("/frontend/public/partials/carrito-btn.html")
              .then((r) => r.text())
              .then((html) => {
                const btnSlot = document.getElementById("cart-btn");
                if (btnSlot) btnSlot.innerHTML = html;
              }),
            fetch("/frontend/public/partials/carrito-content.html")
              .then((r) => r.text())
              .then((html) => {
                let contentSlot = document.getElementById("cart-content");
                if (!contentSlot) {
                  contentSlot = document.createElement("div");
                  contentSlot.id = "cart-content";
                  document.body.appendChild(contentSlot);
                }
                contentSlot.innerHTML = html;
              }),
          ]);
        })
        .catch(console.error);

      // ==========================
      // RESTO DE PARCIALES + INIT
      // ==========================

      // Catálogo: cuando se cargue el HTML, llamamos a initProd() (vaca/cabra)
      const catalogoPromise = fetch("/frontend/public/partials/catalogo.html")
        .then((r) => r.text())
        .then((html) => {
          document.getElementById("catalogo-root").innerHTML = html;
        })
        .then(() => {
          if (typeof initProd === "function") {
            console.log("Llamando a initProd (catálogo vaca/cabra)...");
            initProd();
            initOffers();
          } else {
            console.error("initProd no está definida");
          }
        });

      // Promociones: cuando se cargue el HTML, llamamos a initOffers() (promos)

      const destacadosPromise = fetch(
        "/frontend/public/partials/destacados.html"
      )
        .then((r) => r.text())
        .then((html) => {
          document.getElementById("destacados-root").innerHTML = html;
        })
        .then(() => {
          if (typeof initOffers === "function") {
            console.log("Llamando a initOffers (promociones)...");
            initHighlight();
          } else {
            console.error("initOffers no está definida");
          }
        });

      const carouselPromise = fetch("/frontend/public/partials/carousel.html")
        .then((r) => r.text())
        .then((html) => {
          document.getElementById("carousel-root").innerHTML = html;
        });

      const categoriasPromise = fetch(
        "/frontend/public/partials/categorias.html"
      )
        .then((r) => r.text())
        .then((html) => {
          document.getElementById("categorias-root").innerHTML = html;
        });

      const footerPromise = fetch("/frontend/public/partials/footer.html")
        .then((r) => r.text())
        .then((html) => {
          document.getElementById("footer-root").innerHTML = html;
        });

      Promise.all([
        carouselPromise,
        destacadosPromise,
        catalogoPromise,
        categoriasPromise,
        footerPromise,
      ]).catch(console.error);
    </script>
  </body>
</html>
